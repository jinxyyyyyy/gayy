<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Prodiags Course Viewer</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
margin:0;
background:#f3f4f6;
}

header{
background:#1f2937;
color:white;
padding:15px 25px;
display:flex;
align-items:center;
justify-content:space-between;
}

header h1{
font-size:18px;
margin:0;
}

nav{
background:#111827;
color:white;
padding:10px 25px;
}

nav a{
color:white;
margin-right:15px;
text-decoration:none;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 90px);
}

.sidebar{
width:260px;
background:#fff;
border-right:1px solid #ddd;
padding:15px;
overflow:auto;
}

.sidebar h3{
margin-top:0;
}

.sidebar button{
width:100%;
margin-bottom:10px;
padding:10px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
}

.sidebar button:hover{
background:#1d4ed8;
}

.main{
flex:1;
background:white;
}

iframe{
width:100%;
height:100%;
border:none;
}

#progress{
font-size:13px;
margin-top:10px;
color:#555;
}

.result{
border:1px solid #ddd;
border-radius:8px;
padding:10px;
margin-bottom:10px;
background:#fafafa;
}

</style>

</head>

<body>

<header>

<h1>Prodiags LMS Viewer</h1>

<div>
Course: Ilmastointi ja lämmönhallinta
</div>

</header>

<nav>

<a href="#" onclick="loadCourse()">Course</a>
<a href="#" onclick="loadResults()">Results</a>

</nav>

<div class="container">

<div class="sidebar">

<h3>Tools</h3>

<button onclick="loadCourse()">Open Course</button>
<button onclick="loadResults()">Load Results</button>
<button onclick="exportJSON()">Export JSON</button>

<div id="progress">Idle</div>

<div id="results"></div>

</div>

<div class="main">

<iframe id="viewer"></iframe>

</div>

</div>


<script>

/* ============================
CONFIG
============================ */

const COURSE_URL =
"https://lms.prodiags.eu/index.php?module=courses&course_id=593466995";

const RESULTS_URL =
"https://lms.prodiags.eu/index.php?module=results&part=tab";


let collectedResults=[];


/* ============================
COURSE VIEW
============================ */

function loadCourse(){

document.getElementById("viewer").src=COURSE_URL;

}


/* ============================
RESULTS LOADER
============================ */

async function fetchHTML(url){

const res=await fetch(url,{credentials:"include"});
return await res.text();

}

function parseHTML(html){

return new DOMParser().parseFromString(html,"text/html");

}


async function getResultLinks(){

const progress=document.getElementById("progress");

progress.innerText="Scanning results page...";

const html=await fetchHTML(RESULTS_URL);

const doc=parseHTML(html);

const links=doc.querySelectorAll('a[href*="part=det&id="]');

let resultLinks=[];

links.forEach(a=>{

const url=new URL(a.href).href;

if(!resultLinks.includes(url))
resultLinks.push(url);

});

return resultLinks;

}


async function loadResults(){

const progress=document.getElementById("progress");

progress.innerText="Collecting results...";

const links=await getResultLinks();

progress.innerText="Found "+links.length+" results";

let done=0;

const results=await Promise.all(

links.map(async url=>{

const html=await fetchHTML(url);

done++;

progress.innerText="Loading "+done+" / "+links.length;

return{
url:url,
html:html
};

})

);

collectedResults=results;

renderResults();

progress.innerText="Finished";

}


function renderResults(){

const container=document.getElementById("results");

container.innerHTML="";

collectedResults.forEach(r=>{

const div=document.createElement("div");

div.className="result";

div.innerHTML=

`
<b>Result</b><br>
<a href="${r.url}" target="_blank">${r.url}</a>
`;

container.appendChild(div);

});

}


/* ============================
EXPORT
============================ */

function exportJSON(){

const data=
"data:text/json;charset=utf-8,"+
encodeURIComponent(JSON.stringify(collectedResults,null,2));

const a=document.createElement("a");

a.href=data;
a.download="results.json";

a.click();

}

</script>

</body>
</html>
